---
# General configuration variables
default_user: "aravind"
default_group: "staff"
home_folder: "{{ ansible_user_dir }}"
dotfile_git_repo: "https://github.com/aravindr31/dotfiles.git"
avatar_url: "https://www.ansible.com/images/project-logos/ansible-core.svg"
dry_run: true # Set to true to test without making system changes
update_brew: true # Set to true if you want brew to run update before package install

default_roles:
# - alacritty
- kitty
# - docker-compose
- gh
# - k8s
# - nginx
- nvim
# - nvm
# - spotify
- ssh
# - terraform
- tmux
- git
# - vim
# - vscode
- zsh

git:
  name: "Aravind"
  email: "aravindr597@gmail.com"

# NVM (use 'latest' or pin to a specific tag like 'v0.40.1')
nvm_version: "latest"

# ZSH vars
oh_my_zsh_source_url: "https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh"
keep_current_zsh_config: yes
run_zsh_shell_after_install: yes
change_shell_after_install: yes

docker_compose:
  spin_up_list: []
  spin_down_list: []

# Nginx Proxy Manager
nginx_proxy_manager:
  email: "admin@example.com"
  password: "changeme"

# Plex
plex:
  PLEX_MEDIA_PATH: "{{ home_folder }}/Media"

# Note: Sensitive encrypted variables (discord_webhook, docker_hub, gh, ssh_key, azure_keys)
# are stored in vars/vault.yml
