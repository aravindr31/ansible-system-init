---
# ==============================================================================
# Linux Common Packages (Installed on Debian, Ubuntu, Arch, and Fedora)
# ==============================================================================
general_packages:
  - git
  - zsh
  - vim
  - neovim
  - tmux
  - htop
  - btop
  - curl
  - wget
  - ranger
  - fzf
  - vlc
  # - tor

# ==============================================================================
# Debian / Ubuntu Specific Packages (ansible_os_family == 'Debian')
# ==============================================================================
debian_packages:
  - build-essential
  - kitty
  - keepassxc
  - docker-compose-v2

# ==============================================================================
# Arch Linux / Manjaro Specific Packages (ansible_os_family == 'Archlinux')
# ==============================================================================
arch_packages:
  - base-devel
  - fakeroot
  - kitty
  - keepassxc
  - docker-compose
  - lsd

# ==============================================================================
# Fedora / RedHat Specific Packages (ansible_os_family == 'RedHat')
# ==============================================================================
redhat_packages:
  - gcc
  - make
  - kitty
  - keepassxc
  - docker-compose
  - lsd

# ==============================================================================
# Uninstallation Lists (Managed with --tags uninstall)
# ==============================================================================
general_packages_absent: []
debian_packages_absent: []
arch_packages_absent: []
redhat_packages_absent: []

# Run system autoremove & cache clean during cleanup runs
run_package_cleanup: false
