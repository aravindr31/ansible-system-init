---
extends: default

rules:
  line-length:
    max: 160
    level: warning
  truthy:
    allowed-values: ["true", "false", "yes", "no"]
  comments:
    min-spaces-from-content: 1
  document-start: disable
  indentation:
    indent-sequences: whatever

ignore:
  - "vars/vault.yml"
  - "files/alacritty/colors.yml"
  - "files/alacritty/colors.ymlbak"
