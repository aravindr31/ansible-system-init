name: "CI & Security Checks"

'on':
  push:
    branches:
      - mac-master
      - master
  pull_request:
    branches:
      - mac-master
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: "Secret Leak Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-yaml-and-shell:
    name: "YAML & Shell Linting"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install yamllint

      - name: Run YAML Lint
        run: |
          yamllint -c .yamllint.yml .

      - name: Run ShellCheck on scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./files/zsh/configs"
          severity: warning
        continue-on-error: true

  ansible-syntax-check:
    name: "Ansible Playbook Validation"
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible & Galaxy Requirements
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core
          ansible-galaxy collection install community.general

      - name: Prepare Vault Credential for Syntax Check
        run: |
          mkdir -p "$HOME/.ansible/vault"
          if [ -n "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" ]; then
            echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > "$HOME/.ansible/vault/vault.yml"
            chmod 600 "$HOME/.ansible/vault/vault.yml"
            echo "VAULT_READY=true" >> $GITHUB_ENV
          else
            echo "⚠️ ANSIBLE_VAULT_PASSWORD secret not set in GitHub repository settings."
            echo "Generating dummy vault password for offline syntax checking..."
            echo "mock_vault_password" > "$HOME/.ansible/vault/vault.yml"
            chmod 600 "$HOME/.ansible/vault/vault.yml"
            echo "VAULT_READY=false" >> $GITHUB_ENV
          fi

      - name: Validate Ansible Playbook Syntax
        run: |
          if [ "$VAULT_READY" = "true" ]; then
            ansible-playbook --syntax-check main.yml
          else
            # If vault key is missing in CI secrets, stub encrypted file to verify overall playbook structure
            echo "Running mock syntax verification..."
            mv vars/vault.yml vars/vault.yml.bak
            echo "---" > vars/vault.yml
            echo "discord_webhook: {id: '', token: ''}" >> vars/vault.yml
            echo "docker_hub: {access_key: ''}" >> vars/vault.yml
            echo "gh: {oauth_token: ''}" >> vars/vault.yml
            echo "ssh_key: {}" >> vars/vault.yml
            echo "azure_keys: {}" >> vars/vault.yml

            ansible-playbook --syntax-check main.yml

            mv vars/vault.yml.bak vars/vault.yml
          fi

