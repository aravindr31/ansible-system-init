---
- name: Ensure Linux user fonts directory exists
  file:
    path: "{{ ansible_user_dir }}/.local/share/fonts"
    state: directory
    mode: "0755"

- name: Find custom font files in repository
  find:
    path: "{{ playbook_dir }}/files/fonts/"
    file_type: file
    recurse: true
  register: font_files

- name: Symlink fonts to ~/.local/share/fonts
  file:
    src: "{{ item.path }}"
    dest: "{{ ansible_user_dir }}/.local/share/fonts/{{ item.path | basename }}"
    state: link
  loop: "{{ font_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Refresh font cache
  shell: |
    fc-cache -f
  changed_when: false
  when: not (ansible_host_environment_is_wsl | default(false) | bool)
