---
- name: "Ansible Linux System Init"
  hosts: localhost
  connection: local
  become: false
  gather_facts: true
  gather_subset:
    - '!all'
    - 'min'
    - 'env'

  collections:
    - ansible.builtin
    - community.general

  vars_files:
    - vars/main.yml
    - vars/packages.yml
    - vars/vault.yml

  handlers:
    - name: Import handlers
      import_tasks: handlers/notify.yml

  pre_tasks:
    - name: Ensure required folders exist
      include_tasks: pre_tasks/ensure_folders.yml
      tags: [always]

    - name: Verify user environment
      include_tasks: pre_tasks/whoami.yml
      tags: [always]

    - name: Check for WSL environment
      include_tasks: pre_tasks/wsl_checks.yml
      tags: [always]

    - name: Deploy Linux user fonts
      include_tasks: pre_tasks/add_fonts.yml
      tags: [fonts]

  tasks:
    - name: Linux system package management
      import_tasks: tasks/package_install.yml
      tags:
        - packages
        - install
        - uninstall
        - cleanup

    - name: Configure roles to run
      block:
        - name: Determine active roles
          set_fact:
            run_roles: "{{ default_roles | difference(exclude_roles | default([])) }}"

        - name: Display roles to be applied
          debug:
            var: run_roles

        - name: Apply configured roles
          include_role:
            name: "{{ item }}"
            apply:
              tags:
                - "{{ item }}"
                - roles
          loop: "{{ run_roles }}"
          loop_control:
            label: "{{ item }}"
      tags:
        - roles
        - dotfiles
        - config

    - name: Source updated zshrc
      shell: |
        source {{ ansible_user_dir }}/.zshrc
      args:
        executable: /bin/zsh
      failed_when: false
      tags:
        - zsh
        - dotfiles

  post_tasks:
    - name: Report playbook success
      debug:
        msg: "Playbook completed successfully."
      changed_when: true
      notify: ansible_notifier
      tags: [always]
