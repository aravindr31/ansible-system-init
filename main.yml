---
- name: "Ansible macOS System Init"
  hosts: localhost
  connection: local
  become: false
  gather_facts: true
  gather_subset:
    - '!all'
    - 'min'
    - 'env'

  vars_files:
    - vars/main.yml
    - vars/packages.yml
    - vars/vault.yml

  handlers:
    - name: Import handlers
      ansible.builtin.import_tasks: handlers/notify.yml

  pre_tasks:
    - name: Record start time
      ansible.builtin.include_tasks: pre_tasks/get_start_time.yml
      tags: [always]

    - name: Ensure required folders exist
      ansible.builtin.include_tasks: pre_tasks/ensure_folders.yml
      tags: [always]

    - name: Verify user environment
      ansible.builtin.include_tasks: pre_tasks/whoami.yml
      tags: [always]

    - name: Deploy macOS fonts
      ansible.builtin.include_tasks: pre_tasks/add_fonts.yml
      tags: [fonts]

  tasks:
    - name: Package and application management
      ansible.builtin.import_tasks: tasks/package_install.yml
      tags:
        - packages
        - install
        - uninstall
        - prune
        - cleanup
        - brew

    - name: Configure roles to run
      block:
        - name: Determine active roles
          ansible.builtin.set_fact:
            run_roles: "{{ default_roles | difference(exclude_roles | default([])) }}"

        - name: Display roles to be applied
          ansible.builtin.debug:
            var: run_roles

        - name: Apply configured roles
          ansible.builtin.include_role:
            name: "{{ item }}"
            apply:
              tags:
                - "{{ item }}"
                - roles
          loop: "{{ run_roles }}"
          loop_control:
            label: "{{ item }}"
      tags:
        - roles
        - dotfiles
        - config

  post_tasks:
    - name: Calculate execution time
      ansible.builtin.include_tasks: post_tasks/get_exec_time.yml
      tags: [always]

    - name: Report playbook success
      ansible.builtin.debug:
        msg: "Playbook completed in {{ execution_time | default('N/A') }} seconds."
      changed_when: true
      notify: ansible_notifier
      tags: [always]
