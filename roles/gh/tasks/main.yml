---
- name: Ensure ~/.config/gh directory exists
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.config/gh"
    state: directory
    mode: "0700"
    owner: "{{ default_user }}"
    group: "{{ default_group }}"

- name: Deploy GitHub CLI hosts.yml config
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/gh/hosts.j2"
    dest: "{{ ansible_user_dir }}/.config/gh/hosts.yml"
    mode: "0600"
    owner: "{{ default_user }}"
    group: "{{ default_group }}"
  when: not (dry_run | default(false))
