---
- name: Ensure ~/.ssh directory exists with secure permissions
  file:
    path: "{{ ansible_user_dir }}/.ssh"
    state: directory
    mode: "0700"
    owner: "{{ default_user }}"
    group: "{{ default_user }}"

- name: Install SSH keys directly to ~/.ssh
  copy:
    dest: "{{ ansible_user_dir }}/.ssh/{{ ssh_key_item.key }}"
    content: "{{ ssh_key_item.value }}"
    mode: "{{ '0644' if ssh_key_item.key.endswith('.pub') else '0600' }}"
    owner: "{{ default_user }}"
    group: "{{ default_user }}"
  no_log: true
  loop: "{{ ssh_key | default({}) | dict2items }}"
  loop_control:
    loop_var: ssh_key_item
    label: "{{ ssh_key_item.key }}"
  when: not (dry_run | default(false))

- name: Deploy SSH config
  template:
    src: "{{ playbook_dir }}/templates/ssh/ssh_config.j2"
    dest: "{{ ansible_user_dir }}/.ssh/config"
    mode: "0644"
    owner: "{{ default_user }}"
    group: "{{ default_user }}"
  when: not (dry_run | default(false))
