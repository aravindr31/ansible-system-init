---
- name: Configure global Git settings
  block:
  - name: "Git | Set user.name"
    git_config:
      name: user.name
      scope: global
      value: "{{ git.name }}"

  - name: "Git | Set user.email"
    git_config:
      name: user.email
      scope: global
      value: "{{ git.email }}"

  - name: "Git | Set user.signingkey"
    git_config:
      name: user.signingkey
      scope: global
      value: "{{ ansible_user_dir }}/.ssh/git_admin_key.pub"
  when: not (dry_run | default(false))
