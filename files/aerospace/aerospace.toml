start-at-login = true

after-login-command = []

after-startup-command = [
    'exec-and-forget borders active_color=0xffe1e3e4 style=round inactive_color=0xff494d64 width=5.0'
]

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 30

default-root-container-layout = 'tiles'

default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center',"exec-and-forget osascript -e 'tell application id \"tracesOf.Uebersicht\" to refresh widget id \"simple-bar-index-jsx\"'",]
on-focus-changed = [
      "move-mouse window-lazy-center",
      #"exec-and-forget osascript -e 'tell application id \"tracesOf.Uebersicht\" to refresh widget id \"simple-bar-index-jsx\"'"
  ]

#exec-on-workspace-change = [
  #'/bin/zsh', '-c','/usr/bin/osascript -e "tell application id \"tracesOf.Uebersicht\" to refresh widget id \"simple-bar-index-jsx\""'
  #]

automatically-unhide-macos-hidden-apps = false

[key-mapping]
    preset = 'qwerty'

[gaps]
inner.horizontal = 15
inner.vertical =   15
outer.left =       10
outer.bottom =     5
outer.top =        5
outer.right =      10

[[on-window-detected]]
    if.app-name-regex-substring = 'finder'
    run = 'layout floating'

[[on-window-detected]]
    if.app-name-regex-substring = 'telegram'
    run = 'layout floating'

[[on-window-detected]]
    if.app-name-regex-substring = 'localsend'
    run = 'layout floating'

[[on-window-detected]]
    if.app-name-regex-substring = 'discord'
    run = 'layout floating'

[[on-window-detected]]
    if.app-name-regex-substring = "chrome"
    run = ['move-node-to-workspace 5']

[[on-window-detected]]
    if.app-name-regex-substring = "Code"
    run = ['move-node-to-workspace 6']

[mode.main.binding]

    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'

    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'

    alt-shift-f = 'fullscreen'

    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    alt-shift-semicolon = 'mode service'

    alt-t = 'exec-and-forget open -a /Applications/Telegram\ Desktop.app'
    alt-g = 'exec-and-forget open -a /Applications/Google\ Chrome.app'
    alt-s = 'exec-and-forget open -a /Applications/LocalSend.app'
    alt-w = 'exec-and-forget open -a /Applications/Firefox.app'
    alt-v = 'exec-and-forget open -a /Applications/Visual\ Studio\ Code.app'
    alt-f = 'exec-and-forget open -a /System/Library/CoreServices/Finder.app'
    alt-enter = 'exec-and-forget open -n /Applications/WezTerm.app'
    alt-shift-enter = 'exec-and-forget open -a /Applications/WezTerm'
  
    alt-q = 'close --quit-if-last-window'

    [workspace-to-monitor-force-assignment]
     1 = 'main'
     2 = 'main' 
     3 = 'main' 
     4 = 'main' 
     5 = 'secondary' 
     6 = 'secondary' 
     7 = 'secondary' 
     8 = 'secondary' 
     9 = 'secondary' 


[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

    down = 'volume down'
    up = 'volume up'
    shift-down = ['volume set 0', 'mode main']
